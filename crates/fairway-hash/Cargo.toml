[package]
name = "fairway-hash"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/fairway-hash"
readme = "README.md"
keywords = ["hash", "highwayhash", "siphash", "simd", "prf"]
categories = ["algorithms", "no-std"]
description = "Rust port of Google's HighwayHash (64/128/256-bit) and SipHash/SipHash-1-3, with portable scalar and SIMD (SSE4.1/AVX2/NEON) backends"

[features]
default = ["std"]
std = []
# Force the portable scalar backend even on x86_64 (useful for testing).
portable-only = []
# AVX-512VL backend on x86_64 (runtime-detected avx512f+avx512vl+avx512bw).
# Off by default so the MSRV stays 1.88; enabling it requires Rust 1.89+,
# where the AVX-512 intrinsics and target features were stabilized.
avx512 = []

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# cargo-llvm-cov sets `--cfg coverage` for the measured build; the x86
# backend tests compile out their CPU-detection skip guards under it (the
# machines that measure coverage have AVX2/SSE4.1) so the skipped `return`
# lines don't count against coverage.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[lints.clippy]
undocumented_unsafe_blocks = "deny"

# The benchmark compares against the multi-threaded batch functions.
[[example]]
name = "bench"
required-features = ["std"]
