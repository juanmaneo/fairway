[package]
name = "fairway-hash"
version = "0.1.0"
edition = "2021"
# `<[T]>::as_chunks` is stable since 1.88.
rust-version = "1.88"
description = "Rust port of Google's HighwayHash (64/128/256-bit) and SipHash/SipHash-1-3, with portable scalar and SIMD (SSE4.1/AVX2/NEON) backends"
license = "Apache-2.0"
repository = "https://github.com/juanmaneo/fairway"
homepage = "https://github.com/juanmaneo/fairway"
documentation = "https://docs.rs/fairway-hash"
keywords = ["hash", "highwayhash", "siphash", "simd", "prf"]
categories = ["algorithms", "no-std"]
# Ship only the crate itself: sources, tests, the example and the docs.
# CI config, the dev container and the cargo alias stay out of the tarball.
# (Cargo.lock is always included for the workspace root package; crates.io
# ignores it for libraries.)
exclude = [
    "/.cargo",
    "/.github",
    "/.dockerignore",
    "/Dockerfile",
]

[features]
default = ["std"]
std = []
# Force the portable scalar backend even on x86_64 (useful for testing).
portable-only = []

[workspace]
members = ["xtask"]

[profile.release]
lto = true
