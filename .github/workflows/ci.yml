name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The whole gate is `cargo xtask dev-check`, the same command to run before
  # pushing: fmt, clippy + tests on every feature set, rustdoc, coverage.
  dev-check:
    name: dev-check (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64 # Portable, SSE4.1 and AVX2 backends
            os: ubuntu-latest
          - arch: aarch64 # Portable and NEON backends
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools

      - uses: taiki-e/install-action@cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2

      - name: cargo xtask dev-check
        run: cargo xtask dev-check

  # `rust-version` in Cargo.toml must stay true.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.88

      - uses: Swatinem/rust-cache@v2

      - name: Tests on the MSRV
        run: cargo test --package fairway
